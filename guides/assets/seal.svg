<svg xmlns="http://www.w3.org/2000/svg" width="364" height="148" viewBox="0 0 364 148" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of seal.ld</title>
<desc id="description">1 rung between two power rails. Rung 1: ( xic start | xic run ) xio stop ote run.</desc>
<style>
