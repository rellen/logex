<title id="title">Ladder diagram of belts.ld</title>
<desc id="description">4 rungs between two power rails. Rung 1: add belt_1 belt_2 total ote total_ok. Rung 2: add belt_1 belt_2 total_int ote total_int_ok. Rung 3: move weights[slot] weight. Rung 4: ge slot 0 lt slot 8 move weights[slot] checked.</desc>
