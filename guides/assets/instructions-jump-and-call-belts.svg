<svg xmlns="http://www.w3.org/2000/svg" width="428" height="481" viewBox="0 0 428 481" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of belts.ld</title>
<desc id="description">4 rungs between two power rails. Rung 1: cal s1 start_1 stop belt_1. Rung 2: cal s2 start_2 stop belt_2. Rung 3: xic auto cal s3 start_3 stop belt_3. Rung 4: xic s1.run xic s2.run xic s3.run ote all_run.</desc>
