<svg xmlns="http://www.w3.org/2000/svg" width="364" height="645" viewBox="0 0 364 645" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of skip.ld</title>
<desc id="description">7 rungs between two power rails. Rung 1: xic hold jmp held. Rung 2: xic eye ote lamp. Rung 3: xic eye ctu boxes 100. Rung 4: xic eye ton dwell 300. Rung 5: xic eye osr seen kick. Rung 6: div 100 rate share. Rung 7: lbl held.</desc>
