<svg xmlns="http://www.w3.org/2000/svg" width="448" height="276" viewBox="0 0 448 276" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of lamps.ld</title>
<desc id="description">3 rungs between two power rails. Rung 1: xio motor ote ready_lamp. Rung 2: ( xic motor | xic start ote start_lamp ) xio stop ote motor. Rung 3: xic motor ote run_lamp.</desc>
