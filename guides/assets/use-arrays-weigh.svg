<title id="title">Ladder diagram of weigh.ld</title>
<desc id="description">7 rungs between two power rails. Rung 1: xic eye ons edge ote box. Rung 2: xic box move weights[2] weights[3]. Rung 3: xic box move weights[1] weights[2]. Rung 4: xic box move weights[0] weights[1]. Rung 5: xic box move weight weights[0]. Rung 6: ge weights[0] limits[0] le weights[0] limits[1] ote good. Rung 7: gt weights[0] limits[1] ote heavy.</desc>
