<svg xmlns="http://www.w3.org/2000/svg" width="364" height="449" viewBox="0 0 364 449" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of drive.ld</title>
<desc id="description">4 rungs between two power rails. Rung 1: move hz speed. Rung 2: add hz hz twice ote twice_ok. Rung 3: dint_to_sint level trim ote trim_ok. Rung 4: xic trim_ok move trim offset.</desc>
