<svg xmlns="http://www.w3.org/2000/svg" width="370" height="451" viewBox="0 0 370 451" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of eyes.ld</title>
<desc id="description">4 rungs between two power rails. Rung 1: xor eyes last changed. Rung 2: or alarms changed alarms. Rung 3: move eyes last. Rung 4: xic step ons stepped rol lamps 1 lamps.</desc>
<style>
