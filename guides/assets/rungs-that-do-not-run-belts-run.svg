<svg xmlns="http://www.w3.org/2000/svg" width="569" height="264" viewBox="0 0 569 264" role="img" aria-labelledby="title description">
<title id="title">The cal of belt 3 has no power from scan 4 to scan 6</title>
<desc id="description">8 scans, 100 ms a scan. Each signal after each scan, from scan 1: auto: 1, 1, 1, 0, 0, 0, 1, 1. stop: 0, 0, 0, 1, 1, 1, 1, 1. belt_1: 1, 1, 1, 0, 0, 0, 0, 0. belt_3: 1, 1, 1, 1, 1, 1, 0, 0.</desc>
<style>
