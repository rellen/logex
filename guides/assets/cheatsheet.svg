<svg xmlns="http://www.w3.org/2000/svg" width="380" height="463" viewBox="0 0 380 463" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of cheatsheet.ld</title>
<desc id="description">4 rungs between two power rails. Rung 1: ( xic start | xic motor ) xio stop ote motor. Rung 2: xic motor ton delay 2000. Rung 3: xic delay.dn xic eye ctu boxes 12. Rung 4: ge boxes.cv 10 ote full.</desc>
