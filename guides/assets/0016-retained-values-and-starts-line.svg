<svg xmlns="http://www.w3.org/2000/svg" width="364" height="591" viewBox="0 0 364 591" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of line.ld</title>
<desc id="description">6 rungs between two power rails. Rung 1: ( xic start | xic motor ) xio stop ote motor. Rung 2: xic motor tof run_on 5000. Rung 3: xic run_on.dn ote fan. Rung 4: xic eye ctu boxes 2. Rung 5: xic boxes.q otl full. Rung 6: xic motor rto lube 360000000.</desc>
