<svg xmlns="http://www.w3.org/2000/svg" width="364" height="687" viewBox="0 0 364 687" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of line.ld</title>
<desc id="description">8 rungs between two power rails. Rung 1: xic motor tof run_on 30. Rung 2: xic run_on.dn ote fan. Rung 3: xic fault tp horn_pulse 30. Rung 4: xic horn_pulse.tt ote horn. Rung 5: xic greased ote lube.r. Rung 6: xic motor rto lube 50. Rung 7: xic lube.dn ote grease_due. Rung 8: move lube.acc run_ms.</desc>
