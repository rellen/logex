<svg xmlns="http://www.w3.org/2000/svg" width="394" height="343" viewBox="0 0 394 343" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of boxes.ld</title>
<desc id="description">4 rungs between two power rails. Rung 1: xic eye ons s1 ote new_box. Rung 2: xic new_box add boxes 1 boxes ote count_ok. Rung 3: xic new_box xio count_ok otl overflow. Rung 4: xic reset_pb otu overflow.</desc>
