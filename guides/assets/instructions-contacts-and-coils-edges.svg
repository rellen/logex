<svg xmlns="http://www.w3.org/2000/svg" width="376" height="252" viewBox="0 0 376 252" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of edges.ld</title>
<desc id="description">3 rungs between two power rails. Rung 1: xic eye ons s1 ote new_box. Rung 2: xic eye osr s2 box_in ote eye_lamp. Rung 3: xic eye osf s3 box_out.</desc>
