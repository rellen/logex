<svg xmlns="http://www.w3.org/2000/svg" width="647" height="464" viewBox="0 0 647 464" role="img" aria-labelledby="title description">
<title id="title">conveyor.ld: no pulse in scan 1, then 1 pulse for each edge</title>
<desc id="description">9 scans, 10 ms a scan. Each signal after each scan, from scan 1: index_pb: 1, 0, 1, 1, 1, 1, 1, 0, 1. index: 0, 0, 1, 0, 0, 0, 0, 0, 1. held_lamp: 1, 0, 1, 1, 1, 1, 1, 0, 1. position: 0, 0, 1, 1, 1, 1, 1, 1, 2. eye: 1, 1, 1, 1, 0, 1, 1, 0, 0. boxes: 0, 0, 0, 0, 0, 1, 1, 1, 1. box_left: 0, 0, 0, 0, 1, 0, 0, 1, 0.</desc>
<style>
