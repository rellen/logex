<svg xmlns="http://www.w3.org/2000/svg" width="364" height="124" viewBox="0 0 364 124" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of keypad.ld</title>
<desc id="description">1 rung between two power rails. Rung 1: xic keys[1,2] ote lamp.</desc>
<style>
  .panel { fill: #ffffff; stroke: #d0d7de; }
  .ink { stroke: #1f2328; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .rail { stroke: #1f2328; stroke-width: 2.6; stroke-linecap: round; }
  .box { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.6; }
  .grid { stroke: #d8dee4; stroke-width: 1; }
  .mark { stroke: #bc4c00; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  .wave { stroke: #0550ae; stroke-width: 2; fill: none; stroke-linejoin: miter; }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1f2328; }
  .tag { fill: #0550ae; }
  .dim { fill: #57606a; font-size: 11px; }
  .op { font-weight: 700; }
  .note { fill: #57606a; font-style: italic; }
  .head { font-weight: 700; font-size: 13px; }
  .marked { fill: #bc4c00; font-size: 11px; }
</style>
<rect class="panel" x="0.5" y="0.5" width="363" height="123" rx="6"/>
<line class="rail" x1="46" y1="14" x2="46" y2="112"/>
<line class="rail" x1="346" y1="14" x2="346" y2="112"/>
<text class="note dim" x="54" y="34">the lamp comes on while the last key is</text>
<text class="note dim" x="54" y="48">pressed</text>
<text class="dim" x="36" y="88" text-anchor="end">1</text>
<line class="ink" x1="46" y1="84" x2="68" y2="84"/>
<line class="ink" x1="146" y1="84" x2="278" y2="84"/>
<line class="ink" x1="324" y1="84" x2="346" y2="84"/>
<text class="tag" x="107" y="67" text-anchor="middle">keys[1,2]</text>
<line class="ink" x1="68" y1="84" x2="100" y2="84"/>
<line class="ink" x1="100" y1="73" x2="100" y2="95"/>
<line class="ink" x1="114" y1="73" x2="114" y2="95"/>
<line class="ink" x1="114" y1="84" x2="146" y2="84"/>
<text class="tag" x="301" y="67" text-anchor="middle">lamp</text>
<line class="ink" x1="278" y1="84" x2="290" y2="84"/>
<path class="ink" d="M 295 73 Q 285 84 295 95"/>
<path class="ink" d="M 307 73 Q 317 84 307 95"/>
<line class="ink" x1="312" y1="84" x2="324" y2="84"/>
</svg>
