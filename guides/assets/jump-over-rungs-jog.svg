<svg xmlns="http://www.w3.org/2000/svg" width="470" height="509" viewBox="0 0 470 509" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of jog.ld</title>
<desc id="description">5 rungs between two power rails. Rung 1: xio manual jmp auto ote auto_lamp. Rung 2: xic jog_pb ton jog_t 3000. Rung 3: xic jog_t.dn ote jog_long. Rung 4: lbl auto xic manual xic jog_pb ote jog_lamp. Rung 5: ( xic run_pb xio manual | xic manual xic jog_pb ) ote motor.</desc>
