<text class="note dim" x="54" y="48">fault code of the fan drive</text>
<text class="dim" x="36" y="71" text-anchor="end">1</text>
<line class="ink" x1="46" y1="67" x2="68" y2="67"/>
<line class="ink" x1="68" y1="67" x2="252" y2="67"/>
<line class="ink" x1="324" y1="67" x2="346" y2="67"/>
<rect class="box" x="252" y="54" width="72" height="86" rx="3"/>
<line class="ink" x1="252" y1="80" x2="324" y2="80"/>
<text class="op" x="288" y="71" text-anchor="middle">and</text>
<text class="tag" x="314" y="94" text-anchor="end">status</text>
<text class="tag" x="314" y="112" text-anchor="end">mask</text>
<text class="dim" x="262" y="130">to</text>
<text class="tag" x="314" y="130" text-anchor="end">code</text>
<text class="dim" x="36" y="194" text-anchor="end">2</text>
<line class="ink" x1="46" y1="190" x2="68" y2="190"/>
<line class="ink" x1="170" y1="190" x2="276" y2="190"/>
<line class="ink" x1="324" y1="190" x2="346" y2="190"/>
<rect class="box" x="68" y="177" width="102" height="68" rx="3"/>
<line class="ink" x1="68" y1="203" x2="170" y2="203"/>
<text class="op" x="119" y="194" text-anchor="middle">eq</text>
<text class="tag" x="160" y="217" text-anchor="end">code</text>
<text class="tag" x="160" y="235" text-anchor="end">2#0000_0101</text>
<text class="tag" x="322" y="173" text-anchor="end">fault</text>
<line class="ink" x1="276" y1="190" x2="290" y2="190"/>
<path class="ink" d="M 295 179 Q 285 190 295 201"/>
<path class="ink" d="M 307 179 Q 317 190 307 201"/>
<line class="ink" x1="312" y1="190" x2="324" y2="190"/>
<text class="note dim" x="54" y="277">the fan turns 60 times in 1 minute for</text>
<text class="note dim" x="54" y="291">each Hz</text>
<text class="dim" x="36" y="314" text-anchor="end">3</text>
<line class="ink" x1="46" y1="310" x2="68" y2="310"/>
