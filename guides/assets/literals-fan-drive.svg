<text class="tag" x="118" y="460" text-anchor="end">rpm</text>
<text class="tag" x="118" y="478" text-anchor="end">1.5e3</text>
<text class="tag" x="301" y="416" text-anchor="middle">fast</text>
<line class="ink" x1="278" y1="433" x2="290" y2="433"/>
<path class="ink" d="M 295 422 Q 285 433 295 444"/>
<path class="ink" d="M 307 422 Q 317 433 307 444"/>
<line class="ink" x1="312" y1="433" x2="324" y2="433"/>
<text class="dim" x="36" y="542" text-anchor="end">5</text>
<line class="ink" x1="46" y1="538" x2="68" y2="538"/>
<line class="ink" x1="114" y1="538" x2="252" y2="538"/>
<line class="ink" x1="324" y1="538" x2="346" y2="538"/>
<text class="tag" x="91" y="521" text-anchor="middle">fast</text>
<line class="ink" x1="68" y1="538" x2="84" y2="538"/>
<line class="ink" x1="84" y1="527" x2="84" y2="549"/>
<line class="ink" x1="98" y1="527" x2="98" y2="549"/>
<line class="ink" x1="98" y1="538" x2="114" y2="538"/>
<rect class="box" x="252" y="525" width="72" height="68" rx="3"/>
<line class="ink" x1="252" y1="551" x2="324" y2="551"/>
<text class="op" x="288" y="542" text-anchor="middle">move</text>
<text class="tag" x="314" y="565" text-anchor="end">-120</text>
<text class="dim" x="262" y="583">to</text>
