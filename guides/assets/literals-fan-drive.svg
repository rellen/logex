<line class="ink" x1="68" y1="643" x2="84" y2="643"/>
<line class="ink" x1="84" y1="632" x2="84" y2="654"/>
<line class="ink" x1="98" y1="632" x2="98" y2="654"/>
<line class="ink" x1="98" y1="643" x2="114" y2="643"/>
<line class="ink" x1="86" y1="652" x2="96" y2="634"/>
<rect class="box" x="252" y="630" width="72" height="68" rx="3"/>
<line class="ink" x1="252" y1="656" x2="324" y2="656"/>
<text class="op" x="288" y="647" text-anchor="middle">move</text>
<text class="tag" x="314" y="670" text-anchor="end">0</text>
<text class="dim" x="262" y="688">to</text>
<text class="tag" x="314" y="688" text-anchor="end">trim</text>
<text class="note dim" x="54" y="730">a box that stays at the eye for 30 s is a</text>
<text class="note dim" x="54" y="744">jam</text>
<text class="dim" x="36" y="784" text-anchor="end">7</text>
<line class="ink" x1="46" y1="780" x2="68" y2="780"/>
<line class="ink" x1="154" y1="780" x2="278" y2="780"/>
<line class="ink" x1="324" y1="780" x2="346" y2="780"/>
