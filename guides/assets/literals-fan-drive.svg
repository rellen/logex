<line class="ink" x1="68" y1="780" x2="104" y2="780"/>
<line class="ink" x1="104" y1="769" x2="104" y2="791"/>
<line class="ink" x1="118" y1="769" x2="118" y2="791"/>
<line class="ink" x1="118" y1="780" x2="154" y2="780"/>
