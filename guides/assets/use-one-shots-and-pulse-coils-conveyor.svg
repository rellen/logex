<title id="title">Ladder diagram of conveyor.ld</title>
<desc id="description">4 rungs between two power rails. Rung 1: xic index_pb osr s1 index ote held_lamp. Rung 2: xic index add position 1 position. Rung 3: xic eye ons s2 add boxes 1 boxes. Rung 4: xic eye osf s3 box_left.</desc>
