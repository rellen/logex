<svg xmlns="http://www.w3.org/2000/svg" width="462" height="561" viewBox="0 0 462 561" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of status.ld</title>
<desc id="description">6 rungs between two power rails. Rung 1: xic status.3 ote at_speed. Rung 2: and status 16#00ff flags. Rung 3: shr status 8 error. Rung 4: word_to_uint error code. Rung 5: xic run ote command.0. Rung 6: ge sel 0 lt sel 16 xic status.[sel] ote lamp.</desc>
