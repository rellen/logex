<svg xmlns="http://www.w3.org/2000/svg" width="364" height="535" viewBox="0 0 364 535" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of buffer.ld</title>
<desc id="description">6 rungs between two power rails. Rung 1: xic infeed ctu buffer 3. Rung 2: xic outfeed ctd buffer 3. Rung 3: xic buffer.qu ote buffer_full. Rung 4: xic new_order ote order.ld. Rung 5: xic outfeed ctd order 2. Rung 6: xic order.q ote order_done.</desc>
