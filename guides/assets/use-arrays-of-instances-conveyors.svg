<svg xmlns="http://www.w3.org/2000/svg" width="400" height="654" viewBox="0 0 400 654" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of conveyors.ld</title>
<desc id="description">6 rungs between two power rails. Rung 1: xic eye[0] ton jam[0] 2000. Rung 4: xic eye[0] ctu boxes[0] 1000. Rung 7: cal belts[0] start stop jam[0].dn motor[0]. Rung 10: ge view 0 lt view 3 ote view_ok. Rung 11: xic view_ok move boxes[view].cv count. Rung 12: xic view_ok xic jam[view].dn ote jammed.</desc>
