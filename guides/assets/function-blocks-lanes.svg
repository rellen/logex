<svg xmlns="http://www.w3.org/2000/svg" width="364" height="496" viewBox="0 0 364 496" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of lanes.ld</title>
<desc id="description">5 rungs between two power rails. Rung 1: xic eye[0] ton lane_t[0] 30. Rung 5: xic lane_t[0].dn ctu lane_c[0] 3. Rung 9: cal gates[0] lane_c[0].q kick[0]. Rung 13: move lane_c[lane].cv count. Rung 14: xic lane_t[lane].dn ote held.</desc>
