<title id="title">Ladder diagram of starter.ld</title>
<desc id="description">3 rungs between two power rails. Rung 1: xic eye ton jam_t 2000. Rung 2: xic jam_t.dn ote jammed. Rung 3: ( xic start | xic run ) xio stop xio jammed ote run.</desc>
