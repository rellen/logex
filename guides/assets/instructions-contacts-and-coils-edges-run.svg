<polyline class="wave" points="111.5,118 111.5,118 167.5,118 167.5,118 223.5,118 223.5,118 279.5,118 279.5,118 335.5,118 335.5,92 391.5,92 391.5,118 447.5,118 447.5,118 503.5,118 503.5,118 559.5,118"/>
