<svg xmlns="http://www.w3.org/2000/svg" width="410" height="148" viewBox="0 0 410 148" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of conveyor.ld</title>
<desc id="description">1 rung between two power rails. Rung 3: ( xic start | xic motor ) xio stop xio fault ote motor.</desc>
<style>
