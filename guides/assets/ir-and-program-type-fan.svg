<svg xmlns="http://www.w3.org/2000/svg" width="364" height="454" viewBox="0 0 364 454" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of fan.ld</title>
<desc id="description">5 rungs between two power rails. Rung 1: xic run ton t1 3000. Rung 2: xic t1.dn ote fan. Rung 3: xic status.3 ote alarm. Rung 4: gt temps[slot] 40.0 move 75.5 speed. Rung 5: xic fan gt temps[2] 16#3c otl alarm.</desc>
