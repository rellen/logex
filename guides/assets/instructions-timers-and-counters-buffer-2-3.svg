<svg xmlns="http://www.w3.org/2000/svg" width="364" height="238" viewBox="0 0 364 238" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of buffer.ld</title>
<desc id="description">2 rungs between two power rails. Rung 2: xic infeed ctu stock 3. Rung 3: xic outfeed ctd stock 3.</desc>
<style>
  .panel { fill: #ffffff; stroke: #d0d7de; }
  .ink { stroke: #1f2328; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .rail { stroke: #1f2328; stroke-width: 2.6; stroke-linecap: round; }
  .box { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.6; }
  .grid { stroke: #d8dee4; stroke-width: 1; }
  .mark { stroke: #bc4c00; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  .wave { stroke: #0550ae; stroke-width: 2; fill: none; stroke-linejoin: miter; }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1f2328; }
  .tag { fill: #0550ae; }
  .dim { fill: #57606a; font-size: 11px; }
  .op { font-weight: 700; }
  .note { fill: #57606a; font-style: italic; }
  .head { font-weight: 700; font-size: 13px; }
  .marked { fill: #bc4c00; font-size: 11px; }
</style>
<rect class="panel" x="0.5" y="0.5" width="363" height="237" rx="6"/>
<line class="rail" x1="46" y1="14" x2="46" y2="226"/>
<line class="rail" x1="346" y1="14" x2="346" y2="226"/>
<text class="dim" x="36" y="56" text-anchor="end">2</text>
<line class="ink" x1="46" y1="52" x2="68" y2="52"/>
<line class="ink" x1="124" y1="52" x2="246" y2="52"/>
<line class="ink" x1="324" y1="52" x2="346" y2="52"/>
<text class="tag" x="96" y="35" text-anchor="middle">infeed</text>
<line class="ink" x1="68" y1="52" x2="89" y2="52"/>
<line class="ink" x1="89" y1="41" x2="89" y2="63"/>
<line class="ink" x1="103" y1="41" x2="103" y2="63"/>
<line class="ink" x1="103" y1="52" x2="124" y2="52"/>
<rect class="box" x="246" y="39" width="78" height="68" rx="3"/>
<line class="ink" x1="246" y1="65" x2="324" y2="65"/>
<text class="op" x="285" y="56" text-anchor="middle">ctu</text>
<text class="tag" x="314" y="79" text-anchor="end">stock</text>
<text class="dim" x="256" y="97">preset</text>
<text class="tag" x="314" y="97" text-anchor="end">3</text>
<text class="dim" x="36" y="161" text-anchor="end">3</text>
<line class="ink" x1="46" y1="157" x2="68" y2="157"/>
<line class="ink" x1="132" y1="157" x2="246" y2="157"/>
<line class="ink" x1="324" y1="157" x2="346" y2="157"/>
<text class="tag" x="100" y="140" text-anchor="middle">outfeed</text>
<line class="ink" x1="68" y1="157" x2="93" y2="157"/>
<line class="ink" x1="93" y1="146" x2="93" y2="168"/>
