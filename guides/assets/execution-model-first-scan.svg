<polyline class="wave" points="119,70 119,44 175,44 175,44 231,44 231,70 287,70 287,44 343,44 343,44 399,44 399,70 455,70 455,44 511,44 511,44 567,44"/>
<text class="tag" x="14" y="123">boxes.cv</text>
