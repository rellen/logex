<svg xmlns="http://www.w3.org/2000/svg" width="591" height="292" viewBox="0 0 591 292" role="img" aria-labelledby="title description">
<title id="title">The first scan: the box on the eye at the start is not counted</title>
<desc id="description">8 scans, 10 ms a scan. Each signal after each scan, from scan 1: eye: 1, 1, 0, 1, 1, 0, 1, 1. boxes.cv: 0, 0, 0, 1, 1, 1, 2, 2. pulse: 0, 0, 0, 1, 0, 0, 1, 0. first_out: 1, 0, 0, 0, 0, 0, 0, 0.</desc>
<style>
  .panel { fill: #ffffff; stroke: #d0d7de; }
  .ink { stroke: #1f2328; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .rail { stroke: #1f2328; stroke-width: 2.6; stroke-linecap: round; }
  .box { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.6; }
  .grid { stroke: #d8dee4; stroke-width: 1; }
  .mark { stroke: #bc4c00; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  .wave { stroke: #0550ae; stroke-width: 2; fill: none; stroke-linejoin: miter; }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1f2328; }
  .tag { fill: #0550ae; }
  .dim { fill: #57606a; font-size: 11px; }
  .op { font-weight: 700; }
  .note { fill: #57606a; font-style: italic; }
  .head { font-weight: 700; font-size: 13px; }
  .marked { fill: #bc4c00; font-size: 11px; }
</style>
<rect class="panel" x="0.5" y="0.5" width="590" height="291" rx="6"/>
<text class="head" x="14" y="24">The first scan: the box on the eye at the start is not counted</text>
<text class="dim" x="14" y="266">scan</text>
<text class="dim" x="14" y="280">time</text>
<line class="grid" x1="119.0" y1="36" x2="119.0" y2="250"/>
<line class="grid" x1="175.0" y1="36" x2="175.0" y2="250"/>
<line class="grid" x1="231.0" y1="36" x2="231.0" y2="250"/>
<line class="grid" x1="287.0" y1="36" x2="287.0" y2="250"/>
