<svg xmlns="http://www.w3.org/2000/svg" width="364" height="156" viewBox="0 0 364 156" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of alarm.ld</title>
<desc id="description">2 rungs between two power rails. Rung 1: xic go otl held. Rung 2: xic held ote on.</desc>
<style>
  .panel { fill: #ffffff; stroke: #d0d7de; }
  .ink { stroke: #1f2328; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .rail { stroke: #1f2328; stroke-width: 2.6; stroke-linecap: round; }
  .box { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.6; }
  .grid { stroke: #d8dee4; stroke-width: 1; }
  .mark { stroke: #bc4c00; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  .wave { stroke: #0550ae; stroke-width: 2; fill: none; stroke-linejoin: miter; }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1f2328; }
  .tag { fill: #0550ae; }
  .dim { fill: #57606a; font-size: 11px; }
  .op { font-weight: 700; }
  .note { fill: #57606a; font-style: italic; }
  .head { font-weight: 700; font-size: 13px; }
  .marked { fill: #bc4c00; font-size: 11px; }
</style>
<rect class="panel" x="0.5" y="0.5" width="363" height="155" rx="6"/>
<line class="rail" x1="46" y1="14" x2="46" y2="144"/>
<line class="rail" x1="346" y1="14" x2="346" y2="144"/>
<text class="dim" x="36" y="56" text-anchor="end">1</text>
<line class="ink" x1="46" y1="52" x2="68" y2="52"/>
<line class="ink" x1="114" y1="52" x2="278" y2="52"/>
<line class="ink" x1="324" y1="52" x2="346" y2="52"/>
<text class="tag" x="91" y="35" text-anchor="middle">go</text>
<line class="ink" x1="68" y1="52" x2="84" y2="52"/>
<line class="ink" x1="84" y1="41" x2="84" y2="63"/>
<line class="ink" x1="98" y1="41" x2="98" y2="63"/>
<line class="ink" x1="98" y1="52" x2="114" y2="52"/>
<text class="tag" x="301" y="35" text-anchor="middle">held</text>
<line class="ink" x1="278" y1="52" x2="290" y2="52"/>
<path class="ink" d="M 295 41 Q 285 52 295 63"/>
<path class="ink" d="M 307 41 Q 317 52 307 63"/>
<line class="ink" x1="312" y1="52" x2="324" y2="52"/>
<text class="op" x="301" y="56" text-anchor="middle">L</text>
<text class="dim" x="36" y="120" text-anchor="end">2</text>
<line class="ink" x1="46" y1="116" x2="68" y2="116"/>
<line class="ink" x1="114" y1="116" x2="278" y2="116"/>
<line class="ink" x1="324" y1="116" x2="346" y2="116"/>
<text class="tag" x="91" y="99" text-anchor="middle">held</text>
<line class="ink" x1="68" y1="116" x2="84" y2="116"/>
<line class="ink" x1="84" y1="105" x2="84" y2="127"/>
<line class="ink" x1="98" y1="105" x2="98" y2="127"/>
