<svg xmlns="http://www.w3.org/2000/svg" width="364" height="133" viewBox="0 0 364 133" role="img" aria-labelledby="title description">
<title id="title">Ladder diagram of line.ld</title>
<desc id="description">1 rung between two power rails. Rung 3: xic fault tp horn_pulse 30.</desc>
<style>
  .panel { fill: #ffffff; stroke: #d0d7de; }
  .ink { stroke: #1f2328; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .rail { stroke: #1f2328; stroke-width: 2.6; stroke-linecap: round; }
  .box { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.6; }
  .grid { stroke: #d8dee4; stroke-width: 1; }
  .mark { stroke: #bc4c00; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  .wave { stroke: #0550ae; stroke-width: 2; fill: none; stroke-linejoin: miter; }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1f2328; }
  .tag { fill: #0550ae; }
  .dim { fill: #57606a; font-size: 11px; }
  .op { font-weight: 700; }
  .note { fill: #57606a; font-style: italic; }
  .head { font-weight: 700; font-size: 13px; }
  .marked { fill: #bc4c00; font-size: 11px; }
</style>
<rect class="panel" x="0.5" y="0.5" width="363" height="132" rx="6"/>
<line class="rail" x1="46" y1="14" x2="46" y2="121"/>
<line class="rail" x1="346" y1="14" x2="346" y2="121"/>
<text class="dim" x="36" y="56" text-anchor="end">3</text>
<line class="ink" x1="46" y1="52" x2="68" y2="52"/>
<line class="ink" x1="116" y1="52" x2="228" y2="52"/>
<line class="ink" x1="324" y1="52" x2="346" y2="52"/>
<text class="tag" x="92" y="35" text-anchor="middle">fault</text>
<line class="ink" x1="68" y1="52" x2="85" y2="52"/>
<line class="ink" x1="85" y1="41" x2="85" y2="63"/>
<line class="ink" x1="99" y1="41" x2="99" y2="63"/>
<line class="ink" x1="99" y1="52" x2="116" y2="52"/>
<rect class="box" x="228" y="39" width="96" height="68" rx="3"/>
<line class="ink" x1="228" y1="65" x2="324" y2="65"/>
<text class="op" x="276" y="56" text-anchor="middle">tp</text>
<text class="tag" x="314" y="79" text-anchor="end">horn_pulse</text>
<text class="dim" x="238" y="97">preset</text>
<text class="tag" x="314" y="97" text-anchor="end">30</text>
</svg>
