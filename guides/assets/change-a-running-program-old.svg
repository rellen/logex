<line class="ink" x1="68" y1="52" x2="85" y2="52"/>
<line class="ink" x1="85" y1="41" x2="85" y2="63"/>
<line class="ink" x1="99" y1="41" x2="99" y2="63"/>
<line class="ink" x1="99" y1="52" x2="116" y2="52"/>
