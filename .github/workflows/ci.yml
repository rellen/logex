# The five gates CONTRIBUTING.md asks of every commit (PLAN.md §4·B3; decision 549), as
# scripts/gate.sh runs them, each a step of its own, so each is judged by its own exit
# code, the suite's step naming the tests a red run failed, and the fifth OTP's own
# Dialyzer (decision 515 (c)), behind its PLT's cache. Every push and pull request runs
# them all, no step skipped and no failure let pass (test/logex/scripts_test.exs). The
# toolchain is the pair mix.exs and shell.nix pin: Erlang/OTP 28 and Elixir 1.20.4.
name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      OTP_VERSION: "28"
      ELIXIR_VERSION: "1.20.4"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Erlang/OTP and Elixir
        id: beam
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # No gate reads mix.lock: logex has no dependency but ExDoc, in the docs environment
      # alone, which docs.yml builds in. So the cache is keyed on the versions setup-beam
      # resolved and on mix.exs. It holds Dialyzer's PLT too: actions/cache saves _build
      # whole, its `!_build/dialyzer` taking nothing out, so a run whose key here missed
      # saves the PLT it ends with in this cache, as one whose key below missed saves it
      # in the PLT's own; a run that restored its exact key saves nothing to that cache
      # (decision 580). Either copy is the right one or is not used: scripts/dialyzer.sh
      # names a PLT by the toolchain's versions and the applications it holds, and checks
      # the one it finds against the toolchain.
      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            !_build/dialyzer
          key: mix-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.exs') }}
          restore-keys: |
            mix-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-

      - name: mix format --check-formatted
        run: mix format --check-formatted

      - name: mix compile --force --warnings-as-errors
        run: mix compile --force --warnings-as-errors

      - name: MIX_ENV=test mix compile --force --warnings-as-errors
        run: mix compile --force --warnings-as-errors
        env:
          MIX_ENV: test

      # The suite, and after it the tests that failed, a line each, `file:line: Module: test
      # name` (decision 515 (e)): ExUnit's own summary, `Result: 2938/2939 passed`, names
      # none. `scripts/failed.exs --exit` reads ExUnit's failures manifest, deleted first, as
      # `scripts/gate.sh` deletes it, so that it names this run's failures alone and none a
      # cached `_build` kept; after a red run it names them, or says why it names none, and
      # exits with mix test's code, and after a green one it exits 1 where ExUnit wrote no
      # manifest, a suite a test halted. No key but these three, so that nothing skips the
      # step or lets its failure pass; test/logex/scripts_test.exs holds this file to that
      # and runs the step as written here.
      - name: mix test --warnings-as-errors
        shell: bash
        run: |
          rm -f _build/test/lib/logex/.mix/.mix_test_failures
          rc=0
          mix test --warnings-as-errors || rc=$?
          elixir scripts/failed.exs --exit "$rc"

      # Decision 515 (c): OTP's own dialyzer over logex's compiled modules, the fifth gate,
      # as scripts/gate.sh runs it after the suite (decision 549), scripts/dialyzer.sh,
      # which names its flags, builds or checks its PLT of
      # the toolchain's applications and exits with Dialyzer's code, red on any warning
      # its flags give. The PLT, the toolchain's alone, is cached here by the versions
      # setup-beam resolved and by the script, which names its applications (RV-24's
      # review, F5), a saved one only once a run passes, and no other key restored; the
      # _build cache above holds it too, so this one matters where that one misses
      # (decision 580). A toolchain or a list changed names another PLT, built anew.
      - name: Cache the Dialyzer PLT
        uses: actions/cache@v5
        with:
          path: _build/dialyzer
          key: plt-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('scripts/dialyzer.sh') }}

      - name: scripts/dialyzer.sh
        run: scripts/dialyzer.sh
