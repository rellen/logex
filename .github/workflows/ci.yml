# The four gates CONTRIBUTING.md asks of every commit (PLAN.md §4·B3), each a step of its
# own, so each is judged by its own exit code, the suite's step naming the tests a red run
# failed. Every push and pull request runs them all, no step skipped and no failure let
# pass (test/logex/scripts_test.exs). The toolchain is the pair mix.exs and shell.nix pin:
# Erlang/OTP 28 and Elixir 1.20.4.
name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      OTP_VERSION: "28"
      ELIXIR_VERSION: "1.20.4"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Erlang/OTP and Elixir
        id: beam
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # There is no mix.lock (logex has no dependencies), so the cache is keyed on the
      # versions setup-beam resolved and on mix.exs.
      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.exs') }}
          restore-keys: |
            mix-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-

      - name: mix format --check-formatted
        run: mix format --check-formatted

      - name: mix compile --force --warnings-as-errors
        run: mix compile --force --warnings-as-errors

      - name: MIX_ENV=test mix compile --force --warnings-as-errors
        run: mix compile --force --warnings-as-errors
        env:
          MIX_ENV: test

      # The suite, and after it the tests that failed, a line each, `file:line: Module: test
      # name` (decision 515 (e)): ExUnit's own summary, `Result: 2938/2939 passed`, names
      # none. `scripts/failed.exs --exit` reads ExUnit's failures manifest, deleted first, as
      # `scripts/gate.sh` deletes it, so that it names this run's failures alone and none a
      # cached `_build` kept; after a red run it names them, or says why it names none, and
      # exits with mix test's code, and after a green one it exits 1 where ExUnit wrote no
      # manifest, a suite a test halted. No key but these three, so that nothing skips the
      # step or lets its failure pass; test/logex/scripts_test.exs holds this file to that
      # and runs the step as written here.
      - name: mix test --warnings-as-errors
        shell: bash
        run: |
          rm -f _build/test/lib/logex/.mix/.mix_test_failures
          rc=0
          mix test --warnings-as-errors || rc=$?
          elixir scripts/failed.exs --exit "$rc"
